<!-- admin_user/templates/admin_user/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Login</title>
    <!-- Enlace al CSS de Bootstrap para estilos predeterminados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-4">
            <!-- Título de la sección de login centrado -->
            <h2 class="text-center">Login</h2>
            <!-- Formulario de login -->
            <form method="post">
                <!-- Token CSRF para la protección contra ataques CSRF -->
                {% csrf_token %}
                <!-- Renderiza el formulario como párrafos -->
                {{ form.as_p }}
                <!-- Botón para enviar el formulario, con estilo de Bootstrap -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Enlace al JS de Bootstrap para funcionalidades interactivas -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
