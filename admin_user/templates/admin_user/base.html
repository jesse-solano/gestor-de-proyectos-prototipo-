<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento, que puede ser sobrescrito por plantillas hijas -->
    <title>{% block title %}Movilnet{% endblock %}</title>
    <!-- Enlace al CSS de Bootstrap para estilos predeterminados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Carga de archivos estáticos de Django -->
    {% load static %}
</head>
<body>
    <div class="container-fluid">
        <!-- Bloque de contenido que será sobrescrito por las plantillas hijas -->
        {% block content %}
        {% endblock %}
    </div>
    <!-- Enlace al JS de Bootstrap para funcionalidades interactivas -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
