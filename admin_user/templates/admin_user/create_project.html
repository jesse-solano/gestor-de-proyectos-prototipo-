<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Create Project</title>
    <!-- Enlace al CSS de Bootstrap para estilos predeterminados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Título de la página centrado y con margen superior -->
    <h1 class="text-center mt-5">Create Project</h1>
    <!-- Formulario para crear un nuevo proyecto -->
    <form method="post">
        <!-- Token CSRF para la protección contra ataques CSRF -->
        {% csrf_token %}
        <!-- Renderiza el formulario como párrafos -->
        {{ form.as_p }}
        <!-- Botón para enviar el formulario, con estilo de Bootstrap -->
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Create Project</button>
        </div>
    </form>
</div>
<!-- Enlace al JS de Bootstrap para funcionalidades interactivas -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
