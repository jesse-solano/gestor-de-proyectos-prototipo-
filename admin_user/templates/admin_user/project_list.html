<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadatos del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título del documento -->
    <title>Project List</title>
    <!-- Enlace al CSS de Bootstrap para estilos predeterminados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Título de la página centrado y con margen superior -->
    <h1 class="text-center mt-5">My Projects</h1>
    <!-- Tabla para mostrar la lista de proyectos -->
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Itera sobre la lista de proyectos y muestra su información -->
            {% for project in projects %}
            <tr>
                <td>{{ project.name }}</td>
                <td>{{ project.description }}</td>
                <td>{{ project.created_at }}</td>
                <td>
                    <!-- Aquí se pueden agregar acciones como editar/eliminar -->
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<!-- Enlace al JS de Bootstrap para funcionalidades interactivas -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
