<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5733" />
      <stop offset="100%" stop-color="#E03E1A" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#brandGrad)" filter="url(#subtleShadow)"/>
    <!-- Flow geometric symbol -->
    <path d="M 18 30 C 22 22, 38 22, 42 30 C 46 38, 30 46, 30 46" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="18" cy="30" r="4" fill="#FFFFFF" />
    <circle cx="42" cy="30" r="4" fill="#FFFFFF" />
    <circle cx="30" cy="46" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    Project<tspan fill="#FF5733">Flow</tspan>
  </text>
  <text x="83" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1.5">
    ENTERPRISE PMO
  </text>
</svg>
